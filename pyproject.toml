[build-system]
requires = ["setuptools>=65", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-enhance"
version = "0.2.4"
description = "Small LLM client for prompt enhancement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pe_enhance = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
